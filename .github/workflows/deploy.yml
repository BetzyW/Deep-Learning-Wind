# Publica el libro en GitHub Pages en cada push a main.
# Jupyter Book 1 (formato clásico, sección 11.2 del enunciado). Los notebooks se suben ya ejecutados, así que aquí no se vuelve a correr el análisis.
name: deploy-book
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  BASE_URL: /${{ github.event.repository.name }}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r book/requirements.txt
      - run: jupyter-book build book/ --warningiserror
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
